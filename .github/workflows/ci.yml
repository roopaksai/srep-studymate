name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Type check
        run: pnpm tsc --noEmit
        continue-on-error: true

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          MONGODB_URI: mongodb://localhost:27017/test
          JWT_SECRET: ci-test-secret-key-32-chars-minimum!!
          AI_API_KEY: ci-test-key
          OPENROUTER_API_KEY: ci-test-key
